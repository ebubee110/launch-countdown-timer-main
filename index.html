<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Launch countdown timer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@900&family=Red+Hat+Text:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- Flip animation (Tailwind has no built-in 3D flip keyframes) -->
    <style>
      .flip-card {
        perspective: 400px;
      }
      .flap {
        visibility: hidden;
        backface-visibility: hidden;
        z-index: 10;
      }
      .flap-top {
        transform-origin: bottom;
      }
      .flap-bottom {
        transform-origin: top;
        transform: rotateX(90deg);
      }
      .flipping .flap {
        visibility: visible;
      }
      .flipping .flap-top {
        animation: flip-top 0.3s ease-in forwards;
      }
      .flipping .flap-bottom {
        animation: flip-bottom 0.3s ease-out 0.3s forwards;
      }
      @keyframes flip-top {
        to {
          transform: rotateX(-90deg);
        }
      }
      @keyframes flip-bottom {
        from {
          transform: rotateX(90deg);
        }
        to {
          transform: rotateX(0deg);
        }
      }

      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: black;
        text-decoration: underline;
      }
    </style>
  </head>

  <body
    class="relative min-h-screen overflow-hidden bg-gradient-to-b from-[#1f1e29] to-[#1c1b25] font-['Red_Hat_Text'] font-bold"
  >
    <!-- Stars -->
    <div class="pointer-events-none absolute inset-0" aria-hidden="true">
      <span
        class="absolute left-[10%] top-[2%] h-0.5 w-0.5 rounded-full bg-white/40"
      ></span>
      <span
        class="absolute left-[1%] top-[16%] h-0.5 w-0.5 rounded-full bg-white/30"
      ></span>
      <span
        class="absolute left-[20%] top-[33%] h-0.5 w-0.5 rounded-full bg-white/30"
      ></span>
      <span
        class="absolute left-[45%] top-[50%] h-0.5 w-0.5 rounded-full bg-white/30"
      ></span>
      <span
        class="absolute left-[1%] top-[63%] h-0.5 w-0.5 rounded-full bg-white/30"
      ></span>
      <span
        class="absolute left-[63%] top-[68%] h-0.5 w-0.5 rounded-full bg-white/30"
      ></span>
      <span
        class="absolute left-[85%] top-[12%] h-0.5 w-0.5 rounded-full bg-white/30"
      ></span>
      <span
        class="absolute left-[70%] top-[28%] h-0.5 w-0.5 rounded-full bg-white/20"
      ></span>
    </div>

    <main
      class="relative z-10 flex flex-col items-center px-6 pt-[140px] sm:pt-[170px]"
    >
      <h1
        class="max-w-[260px] text-center text-lg uppercase leading-relaxed tracking-[0.4em] text-white sm:max-w-none sm:text-2xl"
      >
        We’re launching soon
      </h1>

      <!-- Cards are built from the template below by the script -->
      <section
        id="countdown"
        class="mt-14 flex gap-4 sm:mt-20 sm:gap-8"
        aria-label="Launch countdown"
      ></section>
    </main>

    <!-- One flip card (cloned 4x) -->
    <template id="card-tpl">
      <div class="flex flex-col items-center gap-4 sm:gap-8">
        <div
          class="flip-card relative h-[68px] w-[70px] rounded-md shadow-[0_8px_0_0_#171722] sm:h-[148px] sm:w-[148px] sm:rounded-lg"
        >
          <!-- Static halves -->
          <div
            class="absolute inset-x-0 top-0 h-1/2 overflow-hidden rounded-t-md bg-[#343650] sm:rounded-t-lg"
          >
            <span
              data-slot="static-top"
              class="absolute inset-x-0 top-0 flex h-[200%] items-center justify-center font-['Red_Hat_Display'] text-[34px] font-black text-[#fb6087] sm:text-7xl"
            ></span>
          </div>
          <div
            class="absolute inset-x-0 bottom-0 h-1/2 overflow-hidden rounded-b-md bg-[#2c2d44] sm:rounded-b-lg"
          >
            <span
              data-slot="static-bottom"
              class="absolute inset-x-0 bottom-0 flex h-[200%] items-center justify-center font-['Red_Hat_Display'] text-[34px] font-black text-[#fb6087] sm:text-7xl"
            ></span>
          </div>

          <!-- Flaps that rotate from the middle -->
          <div
            class="flap flap-top absolute inset-x-0 top-0 h-1/2 overflow-hidden rounded-t-md bg-[#343650] sm:rounded-t-lg"
          >
            <span
              data-slot="flap-top"
              class="absolute inset-x-0 top-0 flex h-[200%] items-center justify-center font-['Red_Hat_Display'] text-[34px] font-black text-[#fb6087] sm:text-7xl"
            ></span>
          </div>
          <div
            class="flap flap-bottom absolute inset-x-0 bottom-0 h-1/2 overflow-hidden rounded-b-md bg-[#2c2d44] sm:rounded-b-lg"
          >
            <span
              data-slot="flap-bottom"
              class="absolute inset-x-0 bottom-0 flex h-[200%] items-center justify-center font-['Red_Hat_Display'] text-[34px] font-black text-[#fb6087] sm:text-7xl"
            ></span>
          </div>

          <!-- Midline + side notches -->
          <span
            class="absolute inset-x-0 top-1/2 z-20 h-px -translate-y-1/2 bg-black/30"
          ></span>
          <span
            class="absolute -left-1 top-1/2 z-20 h-2 w-2 -translate-y-1/2 rounded-full bg-[#1e1d28] sm:h-3 sm:w-3"
          ></span>
          <span
            class="absolute -right-1 top-1/2 z-20 h-2 w-2 -translate-y-1/2 rounded-full bg-[#1e1d28] sm:h-3 sm:w-3"
          ></span>
        </div>
        <span
          data-slot="label"
          class="text-[8px] uppercase tracking-[0.3em] text-[#8486a9] sm:text-xs"
        ></span>
      </div>
    </template>

    <!-- Hills + social links -->
    <div class="absolute inset-x-0 bottom-0 h-[170px] sm:h-[200px]">
      <svg
        class="absolute inset-0 h-full w-full"
        viewBox="0 0 375 170"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <polygon
          points="90,0 190,52 245,28 290,42 375,10 375,170 0,170 0,12"
          fill="#1a1822"
        />
        <polygon
          points="0,12 90,0 190,52 245,28 290,42 375,25 375,170 0,170"
          fill="#2e2439"
        />
      </svg>

      <ul
        class="absolute inset-x-0 bottom-9 flex items-center justify-center gap-8 text-[#8486a9] sm:bottom-14 sm:gap-10"
      >
        <li>
          <a
            href="#"
            aria-label="Facebook"
            class="block transition-colors hover:text-[#fb6087]"
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M21.6 0H2.4A2.4 2.4 0 0 0 0 2.4v19.2A2.4 2.4 0 0 0 2.4 24h10.3v-9.3H9.6v-3.6h3.1V8.4c0-3.1 1.9-4.8 4.7-4.8 1.3 0 2.5.1 2.8.1v3.2h-1.9c-1.5 0-1.8.7-1.8 1.8v2.4h3.6l-.5 3.6h-3.1V24h6.1a2.4 2.4 0 0 0 2.4-2.4V2.4A2.4 2.4 0 0 0 21.6 0Z"
              />
            </svg>
          </a>
        </li>
        <li>
          <a
            href="#"
            aria-label="Pinterest"
            class="block transition-colors hover:text-[#fb6087]"
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0a12 12 0 0 0-4.4 23.2c-.1-.9-.2-2.4 0-3.4l1.4-6s-.4-.7-.4-1.8c0-1.7 1-2.9 2.2-2.9 1 0 1.5.8 1.5 1.7 0 1-.7 2.6-1 4-.3 1.2.6 2.2 1.8 2.2 2.1 0 3.8-2.3 3.8-5.5 0-2.9-2.1-4.9-5-4.9-3.4 0-5.4 2.6-5.4 5.2 0 1 .4 2.1.9 2.7.1.1.1.2.1.4l-.3 1.4c-.1.2-.2.3-.4.2-1.5-.7-2.4-2.9-2.4-4.6 0-3.8 2.7-7.2 7.9-7.2 4.1 0 7.3 2.9 7.3 6.800 0 4.100-2.600 7.400-6.200 7.400-1.200 0-2.400-.6-2.800-1.400l-.7 2.900c-.3 1-1 2.300-1.500 3.100A12 12 0 1 0 12 0Z"
              />
            </svg>
          </a>
        </li>
        <li>
          <a
            href="#"
            aria-label="Instagram"
            class="block transition-colors hover:text-[#fb6087]"
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M17.3 0H6.7A6.700 6.700 0 0 0 0 6.700v10.600A6.700 6.700 0 0 0 6.700 24h10.600a6.700 6.700 0 0 0 6.700-6.700V6.700A6.700 6.700 0 0 0 17.300 0Zm4.400 17.300a4.400 4.400 0 0 1-4.400 4.400H6.700a4.400 4.400 0 0 1-4.400-4.400V6.700a4.400 4.400 0 0 1 4.400-4.400h10.600a4.400 4.400 0 0 1 4.400 4.400v10.600ZM12 5.800a6.200 6.200 0 1 0 0 12.400 6.200 6.200 0 0 0 0-12.400Zm0 10.100a3.900 3.900 0 1 1 0-7.800 3.900 3.900 0 0 1 0 7.800Zm6.400-11.200a1.500 1.500 0 1 0 0 3 1.500 1.500 0 0 0 0-3Z"
              />
            </svg>
          </a>
        </li>
      </ul>
    </div>
    <footer class="attribution absolute inset-x-0 bottom-0">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a
        href="https://www.linkedin.com/in/ebube-ojiaku-301666318/?isSelfProfile=true"
        >Ebube</a
      >.
    </footer>
    <script src="./JS/countdown.js"></script>
  </body>
</html>
